  const t0=performance.now();(function st(t){if(e._a!==tok)return;const p=Math.min(1,(t-t0)/500);e.textContent=Math.round(f+(v-f)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)})(t0)}
/* tampilan awal */
renderLeg();
let tm;$("fK").onchange=$("fP").onchange=()=>draw(true);$("fQ").oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>draw(true),400)};
$("dq").onclick=()=>{if(eB.length+eO.length+eQ.length+wQ.length)$("errs").style.display=$("errs").style.display=="block"?"none":"block"};
function fromWB(wb){const c=x=>XLSX.utils.sheet_to_csv(wb.Sheets[x],{rawNumbers:true}),n=wb.SheetNames,f=re=>n.find(x=>re.test(x)),
  H={};n.forEach(x=>{try{H[x]=((XLSX.utils.sheet_to_json(wb.Sheets[x],{header:1,range:{s:{r:0,c:0},e:{r:0,c:40}}})[0])||[]).map(v=>String(v==null?"":v).trim().toUpperCase().replace(/\s+/g,"_"))}catch(e){H[x]=[]}});
  const has=(x,k)=>(H[x]||[]).includes(k),
   isQ=x=>has(x,"STOREID")||has(x,"STORE_ID")||has(x,"MERCHANT_ID"),isB=x=>has(x,"TID")&&has(x,"MID"),isO=x=>has(x,"BANK"),
   sk=f(/koordinat/i),sq=n.find(isQ)||n.find(x=>/qris/i.test(x)&&x!=sk&&!isB(x)),so=n.find(isO)||f(/lain|other/i),sx=[sk,sq,so],
   sb=n.find(x=>isB(x)&&!sx.includes(x))||n.find(x=>/bri|edc/i.test(x)&&!sx.includes(x)&&!isQ(x))||n.find(x=>!sx.includes(x)&&!/petunjuk/i.test(x)&&isB(x));
  return{b:sb?c(sb):null,o:so?c(so):null,q:sq?c(sq):null,c:sk?c(sk):null}}
function applyWB(x,d){LOAD=true;try{initMap();if(x.b!=null)loadB(x.b,d);if(x.o!=null)loadO(x.o);setCoords(x.c);if(x.q!=null)loadQ(x.q)}finally{LOAD=false}status();draw(true)}
$("file").onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;$("fname").textContent=fs.map(f=>f.name).join(", ");let x=null,bt=null,ct=null,d=new Date(fs[0].lastModified);
  for(const f of fs){if(/\.xls[xm]?$/i.test(f.name)){x=fromWB(XLSX.read(await f.arrayBuffer(),{type:"array"}));d=new Date(f.lastModified)}
    else if(/koordinat|hasil/i.test(f.name))ct=await f.text();else{bt=await f.text();d=new Date(f.lastModified)}}
  if(!x)x={b:bt,o:null,q:null,c:null};if(ct!=null)x.c=ct;applyWB(x,d)};
let FSAPI=false;
function setFS(on){document.body.classList.toggle("fs",on);$("fsb").innerHTML=on?"&#10005; Keluar layar penuh":"&#9974; Layar penuh";
  if(on){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){try{const r=f.call(el);FSAPI=true;if(r&&r.catch)r.catch(()=>{FSAPI=false})}catch(e){FSAPI=false}}}
  else if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
  setTimeout(()=>{if(map)map.invalidateSize()},150)}
$("fsb").onclick=()=>setFS(!document.body.classList.contains("fs"));
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&FSAPI&&document.body.classList.contains("fs"))setFS(false)});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&document.body.classList.contains("fs"))setFS(false)});
$("fQ").addEventListener("input",()=>{$("qc").style.visibility=$("fQ").value?"visible":"hidden"});
$("qc").onclick=()=>{$("fQ").value="";$("qc").style.visibility="hidden";draw(true)};
$("pmq").oninput=()=>{PM.q=$("pmq").value;pemPanel()};
function startCSV(){fetch(CONFIG.csv).then(r=>{if(!r.ok)throw 0;const lm=r.headers.get("Last-Modified");return r.text().then(t=>loadB(t,lm?new Date(lm):new Date()))})
 .then(()=>fetch(CONFIG.csvOther)).then(r=>{if(!r.ok)throw 0;return r.text()}).then(loadO)
 .catch(()=>{if(!map)$("msg").innerHTML="Pilih file data (Excel/CSV) pada kolom <b>Data (Excel .xlsx atau CSV)</b> di atas untuk menampilkan peta."})}
fetch(CONFIG.xlsx).then(r=>{if(!r.ok)throw 0;const lm=r.headers.get("Last-Modified");return r.arrayBuffer().then(async ab=>{const x=fromWB(XLSX.read(ab,{type:"array"}));
  try{const c=await fetch("koordinat_hasil.csv");if(c.ok)x.c=await c.text()}catch(_){}
  applyWB(x,lm?new Date(lm):new Date());$("fname").textContent=CONFIG.xlsx+" (dimuat otomatis)"})}).catch(startCSV);
</script></body></html>
