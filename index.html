<!DOCTYPE html>

<style>
:root{--nb:#0857C3;--cb:#307FE2;--mb:#71C5EB;--bg:#eef5fc;--ink:#10243e;--mut:#5a6f8a;--line:#d3e2f3}

table{border-collapse:collapse;margin:8px 16px 8px 0;display:inline-table;vertical-align:top}td,th{border:1px solid var(--line);padding:3px 8px;text-align:left}th{background:#e8f1fc;color:var(--nb)}

.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}.chip:hover{transform:translateY(-1px)}.chip.on{background:var(--c);color:#fff;text-shadow:0 0 2px rgba(0,0,0,.4)}.chip.on i{background:#fff}

.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin-bottom:12px;animation:rise .6s .2s both}
.pn{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(8,87,195,.10)}.pn h4{margin:0 0 6px;font-size:13px;color:var(--nb)}
.ct{font-size:12px;color:var(--mut);margin:6px 0 3px}.seg{display:flex;height:22px;border-radius:7px;overflow:hidden;background:#e8f1fc}
.seg span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;cursor:pointer;min-width:2px;transition:opacity .2s;text-shadow:0 0 2px rgba(0,0,0,.4)}.seg span.dim{opacity:.3}
.rk{display:grid;grid-template-columns:100px 1fr auto;gap:6px;align-items:center;font-size:12px;padding:3px 0;cursor:pointer}.rk i{height:8px;background:#e8f1fc;border-radius:5px;overflow:hidden}
.rk u{display:block;height:100%;background:var(--cb);border-radius:5px}.rk:hover span{color:var(--nb)}

#pQ h3 i{transform:rotate(45deg);border-radius:2px}
.pnl .sum{margin-bottom:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.pnl .sum>div{background:#f4f8fd;box-shadow:none}.pnl .grp{margin-top:4px}
.pnl h3 b{margin-left:auto;font-size:24px}.pnl h3 small{font-size:12px;color:var(--mut);font-weight:400}
.seg{height:34px}.seg span{font-size:12px}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:var(--mut)}.lgd span{cursor:pointer;display:inline-flex;align-items:center;gap:5px}.lgd i{width:10px;height:10px;border-radius:3px}.lgd b{color:var(--ink)}.lgd .dim{opacity:.4}
.bl{margin-top:9px;font-size:12px;color:var(--mut);cursor:pointer;display:flex;gap:6px;align-items:center}.bl:before{content:"";width:10px;height:10px;border-radius:50%;background:#8a949e}.bl b{color:var(--ink);font-size:14px}.bl span{font-size:11px;opacity:.7}.bl.off{opacity:.45}
.hint{font-size:11px;color:var(--mut);margin:-6px 2px 10px}
.rk b{font-weight:600;font-size:11px;white-space:nowrap}
.tbs{display:flex;gap:6px;margin:12px 0 6px}.tb{border:1.5px solid var(--c);background:#fff;color:var(--c);border-radius:999px;padding:3px 11px;font:inherit;font-size:12px;cursor:pointer}.tb.on{background:var(--c);color:#fff}
.mlist{max-height:230px;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line)}
.mr{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid #eef3fa;cursor:pointer;font-size:13px}.mr:hover{background:#f4f8fd}
.mr b{color:var(--c);font-size:12px;text-align:center}.mr span small{display:block;color:var(--mut);font-size:11px}.mr em{font-style:normal;font-weight:600;font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.35)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes qpop{from{opacity:0;transform:rotate(45deg) scale(.2)}to{opacity:1;transform:rotate(45deg) scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><h1>PETA SEBARAN TRANSAKSI — BO MANNA</h1><div class="asof" id="asof">DATA AS OF: -</div></header>
<div class="wrap">
<div class="bar">
<label>Tampilkan<select id="fJ"><option value="">Semua (EDC + QRIS)</option><option value="E">EDC saja</option><option value="Q">QRIS saja</option></select></label>
<label id="lK" style="display:none">Kecamatan<select id="fK"></select></label>
<label>Cari merchant / MID / TID<input id="fQ"></label>
<label class="chk"><input type="checkbox" id="fO" checked>EDC bank lain</label>
<label>Data (Excel .xlsx atau CSV)<input type="file" id="file" accept=".xlsx,.xls,.csv" multiple></label>
<span class="dq" id="dq"></span>
</div>
<div class="pans">
<section class="pnl" style="--c:var(--nb)" id="pE"><h3><i></i>EDC BRI<b id="sT">0</b><small id="tE"></small></h3><div id="barE"></div><div id="lsE"></div><div class="bl" id="blE">EDC bank lain <b id="sO">0</b><span>ketuk untuk tampil/sembunyi</span></div></section>
<section class="pnl" style="--c:var(--cb)" id="pQ"><h3><i></i>QRIS<b id="q0">0</b><small id="tQ"></small></h3><div id="barQ"></div><div id="lsQ"></div></section>
</div>
<div class="hint">Ketuk bar atau label untuk memfilter, ketuk lagi untuk membatalkan.</div>
<div id="errs"></div>
<div id="msg">Memuat data …</div>
<div id="map" style="display:none"></div>
<details><summary>Rekap per kecamatan &amp; unit kerja</summary><div id="rkp"></div></details>
<details><summary id="unmS">Data tidak lengkap</summary><div id="unmL"></div></details>
<div class="leg" id="sM"></div><div class="leg" id="leg"></div>
</div>
<script>
/* ===== PENGATURAN (jarang diubah) ===== */
const CONFIG={xlsx:"master_edc.xlsx",csv:"master_edc.csv",csvOther:"edc_bank_lain.csv",
  latRange:[-5.3,-3.6],lonRange:[102.0,104.0],center:[-4.46,102.93],zoom:11,otherColor:"#8a949e",
  attnE:[0,1],attnQ:[0], // kategori sales volume yang dianggap "perlu perhatian" (indeks levels / qLevels)
  qLevels:[{k:"QRIS < Rp50 ribu atau kosong",c:"#d63031",f:v=>v<50000},{k:"QRIS ≥ Rp50 ribu",c:"#27ae60",f:()=>true}],
  levels:[ // urut: merah → hijau. Batas dalam rupiah.
    {k:"Tidak aktif",c:"#d63031",f:v=>v<=0},
    {k:"< 5 juta",c:"#f39c12",f:v=>v<5e6},
    {k:"5 – 14 juta",c:"#f1c40f",f:v=>v<15e6},
    {k:"≥ 15 juta",c:"#27ae60",f:()=>true}]};
const REQ=["NAMA_MERCHANT","MID","TID","ALAMAT","KECAMATAN","SALES_VOLUME"],REQO=["BANK","ALAMAT"];
let B=[],O=[],eB=[],eO=[],map,lyB,lyO,lyQ,asof=null,Q=[],C=[],eQ=[],wQ=[],cen={},cmE={},cmQ={},qs=[0,0,0,0,0,0];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=v=>"Rp "+v.toLocaleString("id-ID"),lvl=v=>CONFIG.levels.findIndex(l=>l.f(v));
const num=s=>{const d=String(s).replace(/,\d{1,2}$/,"").replace(/[^\d]/g,"");return d===""?NaN:+d};

function parseCSV(t){
  t=t.replace(/^\uFEFF/,"");const f=t.split(/\r?\n/)[0],d=(f.split(";").length>f.split(",").length)?";":",";
  const out=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==d){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);out.push(r);r=[];c=""}
    else c+=ch}
  if(c!==""||r.length){r.push(c);out.push(r)}
  const h=out.shift().map(x=>x.trim().toUpperCase().replace(/\s+/g,"_"));
  return out.filter(x=>x.some(v=>v.trim()!="")).map((x,n)=>{const o={_line:n+2};h.forEach((k,i)=>o[k]=(x[i]||"").trim());return o});
}
function validate(data,req,tag,idKey){
  const e=[],seen={};if(!data.length)return[tag+"File kosong atau tidak terbaca"];
  const miss=req.concat(["LATITUDE","LONGITUDE"]).filter(k=>!(k in data[0]));
  if(miss.length)return[tag+"Kolom tidak ditemukan: "+miss.join(", ")];
  data.forEach(r=>{
    const p=tag+"Baris "+r._line+": ";r._bad=false;const n0=e.length;
    req.forEach(k=>{if(!r[k]){e.push(p+k+" kosong");r._bad=true}});
    if(idKey&&r[idKey]){if(seen[r[idKey]]){e.push(p+idKey+" duplikat dengan baris "+seen[r[idKey]]);r._bad=true}else seen[r[idKey]]=r._line}
    if("SALES_VOLUME"in r&&r.SALES_VOLUME){r.sv=num(r.SALES_VOLUME);if(isNaN(r.sv)){e.push(p+"SALES_VOLUME harus angka");r._bad=true}}
    r._nc=!r.LATITUDE&&!r.LONGITUDE;
    if(!r._nc){const la=+r.LATITUDE.replace(",","."),lo=+r.LONGITUDE.replace(",",".");r.la=la;r.lo=lo;
      if(!r.LATITUDE||!r.LONGITUDE||isNaN(la)||isNaN(lo)||la<CONFIG.latRange[0]||la>CONFIG.latRange[1]||lo<CONFIG.lonRange[0]||lo>CONFIG.lonRange[1]){e.push(p+"koordinat tidak valid / di luar area (cek minus, titik desimal, Lat/Long tertukar)");r._bad=true}}
    r._why=e.slice(n0).map(x=>x.slice(p.length)).join("; ")});return e;
}
function initMap(){
  if(map)return;$("msg").style.display="none";$("map").style.display="block";
  map=L.map("map").setView(CONFIG.center,CONFIG.zoom);
  const o={maxZoom:18,attribution:"Tiles © Esri"},S="https://server.arcgisonline.com/ArcGIS/rest/services/",
  j=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}),
  e=L.tileLayer(S+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",o),s=L.tileLayer(S+"World_Imagery/MapServer/tile/{z}/{y}/{x}",o);
  j.addTo(map);L.control.layers({"OpenStreetMap":j,"Jalan (Esri)":e,"Satelit (Esri)":s},null,{position:"topright"}).addTo(map);
  lyO=L.layerGroup().addTo(map);lyQ=L.layerGroup().addTo(map);lyB=L.layerGroup().addTo(map);setTimeout(()=>map.invalidateSize(),50);
}
function status(){
  const all=eB.concat(eO,eQ),dq=$("dq"),nc=B.filter(r=>!r._bad&&r._nc).length;
  dq.className="dq "+(all.length?"err":"ok");
  dq.textContent="Data Quality Check: "+(all.length?"Error ("+all.length+")":"OK")+(wQ.length?" · "+wQ.length+" peringatan":"")+(nc?" · "+nc+" EDC belum ada koordinat":"");
  const t=all.concat(wQ.map(x=>"⚠ "+x));
  $("errs").innerHTML=t.length?"<b>Periksa di Excel, lalu muat ulang file:</b><br>"+t.map(esc).join("<br>"):"";
  $("errs").style.display=t.length?"block":"none";
}
function loadB(t,d){B=parseCSV(t);eB=validate(B,REQ,"[BRI] ","TID");asof=d;
  const ks=[...new Set(B.filter(r=>!r._bad).map(r=>r.KECAMATAN))].sort();
  $("fK").innerHTML='<option value="">Semua</option>'+ks.map(v=>"<option>"+esc(v)+"</option>").join("");$("lK").style.display=ks.length?"flex":"none";
  initMap();status();draw(true)}
const isK=st=>/^KANDIDAT/.test(st||"");
function setCoords(tc){C=tc?parseCSV(tc):[];cmE={};cmQ={};
  C.forEach(r=>{const k=(r.KUNCI||r.MERCHANT_ID||r.TID||"").trim(),la=fl(r.LATITUDE),lo=fl(r.LONGITUDE);if(!k||!okc(la,lo)||isK(String(r.STATUS||"").toUpperCase()))return;
    const o={la,lo,st:(r.STATUS||"VERIFIKASI_MANUAL").toUpperCase()},j=(r.JENIS||(r.MERCHANT_ID?"QRIS":"")).toUpperCase();(j=="EDC"?cmE:cmQ)[k]=o});
  B.forEach(r=>{if(r._nc&&!r._bad&&cmE[r.TID]){const o=cmE[r.TID];r.la=o.la;r.lo=o.lo;r._nc=false;r._st=o.st}})}
const qlv=r=>{const v=num(r.SALES_VOLUME);return isNaN(v)?0:CONFIG.qLevels.findIndex(l=>l.f(v))},kk=s=>String(s||"").trim().toLowerCase(),fl=s=>+String(s).replace(",","."),
okc=(la,lo)=>!isNaN(la)&&!isNaN(lo)&&la>=CONFIG.latRange[0]&&la<=CONFIG.latRange[1]&&lo>=CONFIG.lonRange[0]&&lo<=CONFIG.lonRange[1];
function validateQ(d){const e=[],w=[],seen={},req=["NAMA_MERCHANT","MERCHANT_ID","UNIT_KERJA","ALAMAT","KECAMATAN","SALES_VOLUME"];
  if(!d.length)return{e:["[QRIS] Sheet kosong"],w};const miss=req.filter(k=>!(k in d[0]));
  if(miss.length){d.length=0;return{e:["[QRIS] Kolom tidak ditemukan: "+miss.join(", ")+" (format sumber berubah?)"],w}}
  d.forEach(r=>{const p="[QRIS] Baris "+r._line+": ";r._ex=false;r._own=false;
    if(!r.MERCHANT_ID){r._ex=true;r._exWhy="Merchant ID kosong";e.push(p+"Merchant ID kosong (tidak diproses)")}
    else if(seen[r.MERCHANT_ID]){r._ex=true;r._exWhy="Merchant ID duplikat (baris "+seen[r.MERCHANT_ID]+")";e.push(p+"Merchant ID duplikat dengan baris "+seen[r.MERCHANT_ID]+" (tidak diproses)")}else seen[r.MERCHANT_ID]=r._line;
    ["NAMA_MERCHANT","KECAMATAN","ALAMAT"].forEach(k=>{if(!r[k])w.push(p+k+" kosong")});
    if(!r.SALES_VOLUME)w.push(p+"SALES_VOLUME kosong");else if(isNaN(num(r.SALES_VOLUME)))w.push(p+"SALES_VOLUME bukan angka (ditampilkan apa adanya)");
    if(r.LATITUDE||r.LONGITUDE){const la=fl(r.LATITUDE),lo=fl(r.LONGITUDE);if(okc(la,lo)){r._own=true;r._la=la;r._lo=lo}else w.push(p+"koordinat tidak valid, diabaikan")}});
  return{e,w}}
function loadQ(tq,tc){if(tc!==undefined)setCoords(tc);Q=parseCSV(tq);const v=validateQ(Q);eQ=v.e;wQ=v.w;
  Q.forEach(r=>{if(r._ex){r._cat="X";r._why=r._exWhy;return}
    const p=r._own?{la:r._la,lo:r._lo,st:"SUMBER"}:cmQ[r.MERCHANT_ID];if(p){r._cat="M";r._p=p;return}
    r._cat="U";r._why="koordinat belum ada / tidak valid / belum terverifikasi"});
  const ks=[...new Set(B.filter(r=>!r._bad).concat(Q.filter(r=>r._cat!="X")).map(r=>r.KECAMATAN).filter(Boolean))].sort(),cur=$("fK").value;
  $("fK").innerHTML='<option value="">Semua</option>'+ks.map(v=>"<option>"+esc(v)+"</option>").join("");$("fK").value=cur;$("lK").style.display="flex";
  if(map){status();draw(true)}}
function drawQ(mode){lyQ.clearLayers();const kc=$("fK").value,q=$("fQ").value.trim().toLowerCase(),seen={},pts=[],n=[0,0,0,0,0,0];
  Q.forEach(r=>{if(kc&&r.KECAMATAN!=kc)return;if(q&&!(r.NAMA_MERCHANT+" "+r.ALAMAT+" "+r.UNIT_KERJA).toLowerCase().includes(q))return;
    if(sQ.size&&!sQ.has(qlv(r)))return;
    const l=qlv(r);if(r._cat!="X"){n[0]++;n[1+l]++}
    if(r._cat=="M")n[3]++;else n[5]++;
    if(mode=="E"||r._cat!="M")return;
    const c=CONFIG.qLevels[l].c,key=r._p.la.toFixed(5)+","+r._p.lo.toFixed(5),i=(seen[key]=(seen[key]||0)+1)-1,st=0.00009,ring=Math.floor(i/8)+1,a=i*Math.PI/4,
    la=i?r._p.la+st*ring*Math.sin(a):r._p.la,lo=i?r._p.lo+st*ring*Math.cos(a):r._p.lo;
    const mk=L.marker([la,lo],{icon:L.divIcon({className:"",html:'<div class="qm d'+(pts.length%5)+'" style="background:'+c+'"></div>',iconSize:[14,14]})}).addTo(lyQ);MK.set(r,mk);mk
     .bindPopup("<b>"+esc(r.NAMA_MERCHANT)+"</b><br>Unit Kerja: "+esc(r.UNIT_KERJA)+"<br>Alamat: "+esc(r.ALAMAT)+"<br>Kecamatan: "+esc(r.KECAMATAN)+"<br>Sales Volume: <b>"+esc(isNaN(num(r.SALES_VOLUME))?(r.SALES_VOLUME||"-"):rp(num(r.SALES_VOLUME)))+"</b> ("+(isNaN(num(r.SALES_VOLUME))?"sales volume kosong / tidak terbaca":CONFIG.qLevels[l].k)+")");
    pts.push([la,lo])});
  cnum("q0",n[0]);qs=n;return pts}
function rekap(){const k={},u={};
  B.filter(r=>!r._bad).forEach(r=>{(k[r.KECAMATAN]=k[r.KECAMATAN]||[0,0])[0]++});
  Q.filter(r=>r._cat!="X").forEach(r=>{const x=r.KECAMATAN||"(kosong)",y=r.UNIT_KERJA||"(kosong)";(k[x]=k[x]||[0,0])[1]++;u[y]=(u[y]||0)+1});
  const t=(h,rows)=>"<table><tr>"+h.map(x=>"<th>"+x+"</th>").join("")+"</tr>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</table>";
  $("rkp").innerHTML=t(["Kecamatan","EDC BRI","QRIS"],Object.keys(k).sort().map(x=>[x,k[x][0],k[x][1]]))+t(["Unit Kerja (QRIS)","Merchant"],Object.keys(u).sort().map(x=>[x,u[x]]));
  const bs=B.filter(r=>r._bad||r._nc).map(r=>["EDC BRI",r.NAMA_MERCHANT,r.TID,r.KECAMATAN,r._bad?r._why:"koordinat belum ada"]),
    os=O.filter(r=>r._bad||r._nc).map(r=>["EDC Bank Lain",r.NAMA_MERCHANT||"-",r.BANK,"-",r._bad?r._why:"koordinat belum ada"]),
    qs=Q.filter(r=>r._cat!="M").map(r=>["QRIS",r.NAMA_MERCHANT,r.MERCHANT_ID,r.KECAMATAN,r._why]),all=bs.concat(os,qs);
  $("unmS").textContent="Data tidak lengkap ("+all.length+": EDC BRI "+bs.length+" · Bank Lain "+os.length+" · QRIS "+qs.length+")";
  $("unmL").innerHTML=all.length?t(["Sumber","Nama Merchant","TID / Bank / Merchant ID","Kecamatan","Keterangan"],all):"Tidak ada."}
function loadO(t){O=parseCSV(t);eO=validate(O,REQO,"[Bank lain] ");if(map){status();draw(false)}else pendingO=true}
let pendingO=false;
function draw(fit){
  if(!map)return;
  const kc=$("fK").value,q=$("fQ").value.trim().toLowerCase();
  $("asof").textContent="DATA AS OF: "+(asof?asof.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):"-");
  MK.clear();const mode=$('fJ').value;$("pE").style.display=mode=="Q"?"none":"";$("pQ").style.display=mode=="E"?"none":"";lyB.clearLayers();lyO.clearLayers();const cnt=CONFIG.levels.map(()=>0),seen={},pts=[];let tot=0,NC=0;
  B.filter(r=>!r._bad).forEach(r=>{
    const L_=lvl(r.sv);
    if(sE.size&&!sE.has(L_))return;if(kc&&r.KECAMATAN!=kc)return;
    if(q&&!(r.NAMA_MERCHANT+" "+r.MID+" "+r.TID+" "+r.ALAMAT).toLowerCase().includes(q))return;
    cnt[L_]++;tot++;if(r._nc){NC++;return}
    const key=r.la.toFixed(5)+","+r.lo.toFixed(5),n=seen[key]=(seen[key]||0)+1,k2=n-1,ring=Math.floor(k2/8)+1,a=k2*Math.PI/4,
    la=n>1?r.la+0.00009*ring*Math.sin(a):r.la,lo=n>1?r.lo+0.00009*ring*Math.cos(a):r.lo,lv=CONFIG.levels[L_];
    const mk=L.circleMarker([la,lo],{radius:8,color:"#fff",weight:1.5,fillColor:lv.c,fillOpacity:.95,className:"pop d"+(pts.length%5)}).addTo(lyB);MK.set(r,mk);mk
     .bindPopup("<b>"+esc(r.NAMA_MERCHANT)+"</b><br>MID: "+esc(r.MID)+"<br>TID: "+esc(r.TID)+"<br>Alamat: "+esc(r.ALAMAT)+"<br>Kecamatan: "+esc(r.KECAMATAN)+"<br>Total Sales Volume: <b>"+rp(r.sv)+"</b> ("+lv.k+")");
    pts.push([la,lo]);
  });
  let no=0;
  if($("fO").checked)O.filter(r=>!r._bad&&!r._nc).forEach(r=>{no++;
    L.circleMarker([r.la,r.lo],{radius:6,color:"#fff",weight:1,fillColor:CONFIG.otherColor,fillOpacity:.9}).addTo(lyO)
     .bindPopup("<b>"+esc(r.BANK)+"</b>"+(r.NAMA_MERCHANT?"<br>"+esc(r.NAMA_MERCHANT):"")+"<br>"+esc(r.ALAMAT))});
  cnum("sT",tot);
  cnum("sO",O.filter(r=>!r._bad).length);
  $("sM").textContent=NC?"EDC tampil di peta: "+(tot-NC)+" dari "+tot+" (sisanya belum ada koordinat). ":"";
  const qp=drawQ(mode);if(mode=="Q")lyB.clearLayers();rekap();insight();
  if(Q.length)$("sM").textContent+="QRIS tampil di peta: "+qs[3]+" dari "+(qs[3]+qs[5])+" (sisanya belum ada koordinat atau bermasalah).";
  const fp=mode=="Q"?qp:mode=="E"?pts:pts.concat(qp);if(fit&&fp.length)map.fitBounds(fp,{padding:[30,30],maxZoom:14});
}
const sE=new Set(),sQ=new Set(),MK=new Map(),TB={E:0,Q:0};let RL=[];
function tog(S,i){S.has(i)?S.delete(i):S.add(i);draw(true)}
function insight(){
  const kc=$("fK").value,q=$("fQ").value.trim().toLowerCase(),LB=CONFIG.levels,LQ=CONFIG.qLevels,cE=LB.map(()=>0),cQ=LQ.map(()=>0),iE=[],iQ=[];RL=[];
  B.filter(r=>!r._bad).forEach(r=>{if(kc&&r.KECAMATAN!=kc)return;if(q&&!(r.NAMA_MERCHANT+" "+r.MID+" "+r.TID+" "+r.ALAMAT).toLowerCase().includes(q))return;
    const l=lvl(r.sv);cE[l]++;if(!sE.size||sE.has(l))iE.push({r,v:r.sv,name:r.NAMA_MERCHANT,kec:r.KECAMATAN})});
  Q.filter(r=>r._cat!="X").forEach(r=>{if(kc&&r.KECAMATAN!=kc)return;if(q&&!(r.NAMA_MERCHANT+" "+r.ALAMAT+" "+r.UNIT_KERJA).toLowerCase().includes(q))return;
    const l=qlv(r),v=num(r.SALES_VOLUME);cQ[l]++;if((!sQ.size||sQ.has(l))&&!isNaN(v))iQ.push({r,v,name:r.NAMA_MERCHANT,kec:r.KECAMATAN})});
  const bar=(S,c,L,t)=>{const T=c.reduce((a,b)=>a+b,0)||1,d=i=>S.size&&!S.has(i)?"dim":"";
    return'<div class="seg">'+L.map((l,i)=>'<span class="'+d(i)+'" data-'+t+'="'+i+'" style="flex:'+(c[i]||.0001)+';background:'+l.c+'" title="'+esc(l.k)+': '+c[i]+'">'+(c[i]/T>.1?c[i]+" ("+Math.round(c[i]/T*100)+"%)":"")+'</span>').join("")+'</div><div class="lgd">'+L.map((l,i)=>'<span class="'+d(i)+'" data-'+t+'="'+i+'"><i style="background:'+l.c+'"></i>'+esc(l.k.replace("QRIS ",""))+' <b>'+c[i]+'</b></span>').join("")+'</div>'},
  mkList=(tag,items)=>{const t=TB[tag],srt=items.slice().sort((a,b)=>(t?a.v-b.v:b.v-a.v)||String(a.name).localeCompare(String(b.name))).slice(0,10),base=RL.length;srt.forEach(x=>RL.push(x.r));
    return'<div class="tbs"><button class="tb'+(t?"":" on")+'" data-tb="'+tag+'0">Terbanyak</button><button class="tb'+(t?" on":"")+'" data-tb="'+tag+'1">Perlu perhatian</button></div><div class="mlist">'+
      (srt.length?srt.map((x,i)=>'<div class="mr" data-r="'+(base+i)+'"><b>'+(i+1)+'</b><span>'+esc(x.name)+'<small>'+esc(x.kec||"-")+'</small></span><em>'+rp(x.v)+'</em></div>').join(""):'<div class="ct">Tidak ada data</div>')+'</div>'};
  $("barE").innerHTML=bar(sE,cE,LB,"e");$("barQ").innerHTML=bar(sQ,cQ,LQ,"q");
  $("lsE").innerHTML=mkList("E",iE);$("lsQ").innerHTML=mkList("Q",iQ);
  $("tE").textContent=sE.size?"dari "+cE.reduce((a,b)=>a+b,0):"";$("tQ").textContent=sQ.size?"dari "+cQ.reduce((a,b)=>a+b,0):"";
  const bl=$("blE");if(bl&&bl.classList)bl.classList.toggle("off",!$("fO").checked)}
function go(r){const m=MK.get(r);if(m&&(lyB.hasLayer(m)||lyQ.hasLayer(m))){map.setView(m.getLatLng(),Math.max(map.getZoom(),16));m.openPopup();const e=$("map");if(e.scrollIntoView)e.scrollIntoView({behavior:"smooth",block:"center"})}
  else $("sM").textContent="Merchant ini belum punya koordinat atau sedang disembunyikan di peta."}
if(document.addEventListener)document.addEventListener("click",e=>{
  if(e.target.closest("#blE")){$("fO").checked=!$("fO").checked;draw(true);return}
  const tb=e.target.closest("[data-tb]");if(tb){TB[tb.dataset.tb[0]]=+tb.dataset.tb[1];insight();return}
  const rw=e.target.closest("[data-r]");if(rw){go(RL[+rw.dataset.r]);return}
  const x=e.target.closest("[data-e],[data-q],[data-k]");
  if(x){if(x.dataset.e!=null)tog(sE,+x.dataset.e);else if(x.dataset.q!=null)tog(sQ,+x.dataset.q);
    else{const o=$("fK");if([...o.options].some(v=>v.value==x.dataset.k)){o.value=o.value==x.dataset.k?"":x.dataset.k;draw(true)}}return}
  const c=e.target.closest(".sum>div");if(!c)return;const id=(c.querySelector("b")||{}).id||"",m=id.match(/^c(\d)$/);
  if(id=="sT"){sE.clear();draw(true)}else if(m)tog(sE,+m[1]);else if(id=="q0"){sQ.clear();draw(true)}
  else if(id=="q1")tog(sQ,0);else if(id=="q2")tog(sQ,1);else if(id=="sO"){$("fO").checked=!$("fO").checked;draw(true)}});
const RM=typeof matchMedia!="undefined"&&matchMedia("(prefers-reduced-motion:reduce)").matches;
function cnum(id,v){const e=$(id),f=+e.textContent||0,tok=e._a=(e._a||0)+1;
  if(RM||typeof requestAnimationFrame=="undefined"||f==v){e.textContent=v;return}
  const t0=performance.now();(function st(t){if(e._a!==tok)return;const p=Math.min(1,(t-t0)/500);e.textContent=Math.round(f+(v-f)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)})(t0)}
/* tampilan awal */
$("leg").innerHTML="Sales volume: "+CONFIG.levels.map(l=>'<span class="dot" style="background:'+l.c+'"></span>'+l.k).join("")+'<span class="dot" style="background:'+CONFIG.otherColor+'"></span>Bank lain | '+CONFIG.qLevels.map(l=>'<span class="dot" style="background:'+l.c+';border-radius:2px;transform:rotate(45deg)"></span>'+l.k).join("");
let tm;$("fK").onchange=$("fO").onchange=$("fJ").onchange=()=>draw(true);$("fQ").oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>draw(true),400)};
$("dq").onclick=()=>{if(eB.length+eO.length+eQ.length+wQ.length)$("errs").style.display=$("errs").style.display=="block"?"none":"block"};
function fromWB(wb){const c=x=>XLSX.utils.sheet_to_csv(wb.Sheets[x],{rawNumbers:true}),n=wb.SheetNames,f=re=>n.find(x=>re.test(x)),
  sk=f(/koordinat/i),sq=n.find(x=>/qris/i.test(x)&&x!=sk),so=f(/lain|other/i),sx=[sk,sq,so],
  sb=n.find(x=>/bri|edc/i.test(x)&&!sx.includes(x))||n.find(x=>!sx.includes(x)&&!/petunjuk/i.test(x));
  return{b:c(sb),o:so?c(so):null,q:sq?c(sq):null,c:sk?c(sk):null}}
function applyWB(x,d){loadB(x.b,d);if(x.o!=null)loadO(x.o);setCoords(x.c);if(x.q!=null)loadQ(x.q);else{status();draw(true)}}
$("file").onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;let x=null,bt=null,ct=null,d=new Date(fs[0].lastModified);
  for(const f of fs){if(/\.xls[xm]?$/i.test(f.name)){x=fromWB(XLSX.read(await f.arrayBuffer(),{type:"array"}));d=new Date(f.lastModified)}
    else if(/koordinat|hasil/i.test(f.name))ct=await f.text();else{bt=await f.text();d=new Date(f.lastModified)}}
  if(!x)x={b:bt,o:null,q:null,c:null};if(ct!=null)x.c=ct;applyWB(x,d)};
function startCSV(){fetch(CONFIG.csv).then(r=>{if(!r.ok)throw 0;const lm=r.headers.get("Last-Modified");return r.text().then(t=>loadB(t,lm?new Date(lm):new Date()))})
 .then(()=>fetch(CONFIG.csvOther)).then(r=>{if(!r.ok)throw 0;return r.text()}).then(loadO)
 .catch(()=>{if(!map)$("msg").innerHTML="Pilih file data (Excel/CSV) pada kolom <b>Data (Excel .xlsx atau CSV)</b> di atas untuk menampilkan peta."})}
fetch(CONFIG.xlsx).then(r=>{if(!r.ok)throw 0;const lm=r.headers.get("Last-Modified");return r.arrayBuffer().then(async ab=>{const x=fromWB(XLSX.read(ab,{type:"array"}));
  try{const c=await fetch("koordinat_hasil.csv");if(c.ok)x.c=await c.text()}catch(_){}
  applyWB(x,lm?new Date(lm):new Date())})}).catch(startCSV);
